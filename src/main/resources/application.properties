# ============================================
# MASTER CRM - BACKEND CONFIGURATION
# ============================================

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# Application URLs
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173
app.api-url=http://localhost:8080/api

# Security
app.jwt-secret=your-super-secret-jwt-key-change-in-production
app.jwt-expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

# Connection Timeout
server.connection-timeout=300s
server.tomcat.connection-timeout=300s

# Logging
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# CSV File Paths
app.csv.users-file=users.csv
app.csv.leads-file=leads.csv
app.csv.dispositions-file=dispositions.csv

# Default Users
app.default.super-admin-username=superadmin
app.default.super-admin-password=super123
app.default.admin-username=admin
app.default.admin-password=admin123
app.default.agent-username=agent
app.default.agent-password=agent123

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC
